<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ScrollShot editor</title><link rel="stylesheet" href="style.css"></head><body><header class="editor-head"><h1 id="title">Recent captures</h1><div class="export"><button id="recent">Recent captures</button><select id="format" aria-label="Export format"><option value="png">PNG</option><option value="jpeg">JPEG</option><option value="pdf">PDF</option></select><button id="download" class="primary">Download</button><button id="copy">Copy image</button></div></header><section id="editing" hidden><div class="tools"><button data-tool="crop">Crop</button><button data-tool="arrow">Arrow</button><button data-tool="rectangle">Rectangle</button><button data-tool="text">Text</button><button data-tool="blur">Blur</button><label>Color <input type="color" id="color" value="#ef4444"></label><label>Size <input type="number" id="size" value="4" min="1" max="40"></label><input id="text" placeholder="Annotation text" aria-label="Annotation text"><button id="undo">Undo</button><button id="reset">Reset to captured image</button><button id="save">Save edits</button><span id="dimensions"></span></div><p id="message" role="status">Choose a tool. Drag to draw or crop; click to place text.</p><div class="canvas-wrap"><canvas id="canvas"></canvas></div></section><section id="history"></section><script type="module" src="editor.js"></script></body></html>
